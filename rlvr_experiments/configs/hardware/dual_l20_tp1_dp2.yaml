# Hardware overlay. Algorithm, LoRA and sampling stay in base.yaml.
# No new throughput acceptance was performed during directory migration.
actor_rollout_ref:
  hybrid_engine: true
  actor:
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    tensor_model_parallel_size: 1
    data_parallel_size: 2
    gpu_memory_utilization: 0.7
    max_num_seqs: 64
    max_num_batched_tokens: 8192
    enforce_eager: false
    free_cache_engine: true
trainer:
  n_gpus_per_node: 2
  nnodes: 1
  v1:
    trainer_mode: sync
