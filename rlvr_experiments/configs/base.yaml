defaults:
- ppo_trainer
- _self_
rlvr:
  project_dir: ${oc.env:RLVR_PROJECT_DIR}
  phase: reward_dev
  run_dir: ${rlvr.project_dir}/runs/unset
  prepared_dir: ${oc.env:RLVR_PREPARED_DIR}
  prepared_eval_dir: ${oc.env:RLVR_PREPARED_EVAL_DIR}
  source_root: ${oc.env:RLVR_SOURCE_ROOT}
  contracts_dir: ${rlvr.project_dir}/contracts
  manifest_path: ${rlvr.prepared_dir}/train_plan.json
  data_manifest_path: ${rlvr.prepared_dir}/manifest.json
  train_updates: 50
  prompts_per_update: 32
  num_generations: 8
  base_seed: 42
  strict_exposure: true
  training_mode: lora
  diagnostic_updates: []
  measurement: null
  reward_profile: R0
  component_flags:
    compute_cost: false
    prefix_value: false
    consistency: false
    structure: false
  eval:
    sampled_generations: 8
    greedy_generations: 1
    seed_namespace: rlvr-eval-seed-v1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
  throughput:
    warmup_steps: 1
    measured_steps: 10
    max_p95_median_ratio: 1.5
    min_timeweighted_gpu_utilization: 0.4
    diagnostic_steps: 3
    max_offload_critical_path_fraction: 0.4
  adapter_seed: 20261008
  adapter_init_reference: ${rlvr.contracts_dir}/initialization/step0-adapter-reference.json
  evaluation_reference: ${rlvr.contracts_dir}/evaluation/reward_dev_submission.json
  standalone_contract: null
data:
  train_files:
  - ${rlvr.prepared_dir}/reward_dev_train.parquet
  val_files:
  - ${rlvr.prepared_eval_dir}/reward_dev_eval.parquet
  train_batch_size: 32
  gen_batch_size: 32
  val_batch_size: 32
  max_prompt_length: 4096
  max_response_length: 4096
  shuffle: false
  seed: 42
  dataloader_num_workers: 0
  validation_shuffle: false
  filter_overlong_prompts: false
  truncation: error
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: true
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
actor_rollout_ref:
  hybrid_engine: true
  model:
    external_lib: rlvr.rollout
    path: ${oc.env:RLVR_MODEL_PATH}
    enable_gradient_checkpointing: true
    use_remove_padding: false
    use_fused_kernels: false
    override_config:
      attn_implementation: sdpa
    trust_remote_code: true
    lora_rank: 32
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_adapter_path: null
    lora:
      merge: false
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 8192
    ppo_epochs: 1
    shuffle: false
    data_loader_seed: 42
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0.0
    calculate_entropy: false
    checkpoint:
      save_lora_only: true
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    loss_agg_mode: token-mean
    policy_loss:
      loss_mode: vanilla
    optim:
      lr: 1.0e-06
      lr_warmup_steps_ratio: 0.0
      lr_warmup_steps: 0
      lr_scheduler_type: constant
      weight_decay: 0.01
    fsdp_config:
      strategy: fsdp2
      model_dtype: bf16
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      ulysses_sequence_parallel_size: 1
      full_determinism: false
      entropy_checkpointing: true
      use_no_sync_for_gradient_accumulation: false
      seed: 42
  ref:
    strategy: fsdp2
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 8192
    fsdp_config:
      strategy: fsdp2
      model_dtype: bf16
      param_offload: true
      optimizer_offload: false
      offload_policy: false
      seed: 42
  rollout:
    agent:
      default_agent_loop: rlvr_single_turn
      agent_loop_config_path: ${rlvr.project_dir}/configs/agent_loops.yaml
    name: vllm
    mode: async
    n: 8
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    do_sample: true
    response_length: 4096
    prompt_length: 4096
    max_model_len: 8192
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    max_num_seqs: 64
    max_num_batched_tokens: 8192
    dtype: bfloat16
    seed: 42
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 8192
    enable_chunked_prefill: true
    enable_prefix_caching: true
    disable_log_stats: false
    enforce_eager: false
    free_cache_engine: true
    load_format: safetensors
    layered_summon: true
    engine_kwargs:
      vllm:
        attention_backend: FLASH_ATTN
    val_kwargs:
      n: 8
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
    data_parallel_size: 2
reward:
  num_workers: 2
  reward_manager:
    source: importlib
    name: RLVRRewardManager
    module:
      path: ${rlvr.project_dir}/rlvr/reward.py
  reward_model:
    enable: false
trainer:
  n_gpus_per_node: 2
  nnodes: 1
  project_name: tibetan-rlvr
  experiment_name: ${rlvr.phase}-${rlvr.reward_profile}
  total_epochs: 1
  total_training_steps: ${rlvr.train_updates}
  test_freq: -1
  val_before_train: false
  save_freq: ${rlvr.train_updates}
  max_actor_ckpt_to_keep: 1
  resume_mode: disable
  default_local_dir: ${rlvr.run_dir}/checkpoints
  rollout_data_dir: ${rlvr.run_dir}/verl_rollouts
  logger:
  - console
  v1:
    sampler:
      max_off_policy_threshold: null
      max_off_policy_strategy: wait
      sync_refill_failed_groups: false
    trainer_mode: sync
    colocate_async:
      num_warmup_batches: 0
    separate_async:
      num_warmup_batches: 0
global_profiler:
  tool: null
  steps: null
